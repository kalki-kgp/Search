[package]
name = "shield-compiler"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

# Turns Brave's filter lists into what WebKit can enforce by itself. Run by
# Search when the lists are due for a refresh, and gone again when it has
# written its files: nothing here stays in memory while you browse.

[dependencies]
adblock = { version = "0.13.3", features = ["content-blocking", "css-validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
